<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>📚 EduGenie</h1>

    <p class="subtitle">
        Google Gemini Powered Learning Assistant
    </p>

    <form method="post" action="/generate">

        <label for="prompt">
            Ask a Question or Enter a Topic
        </label>

        <textarea
            id="prompt"
            name="prompt"
            placeholder="Example: Explain the Pythagoras theorem in simple words..."
            required
        >{{ prompt or "" }}</textarea>

        <button type="submit">
            Generate
        </button>

    </form>

    {% if result %}

    <div class="result">

        <h2>🤖 EduGenie Result</h2>

        <div class="result-box">
            {{ result }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
